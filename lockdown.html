<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, push, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB5aAwZNWcJEbVBUXu3S_Q68drt1mZ20bE",
    authDomain: "bettercord-52166.firebaseapp.com",
    databaseURL: "https://bettercord-52166-default-rtdb.firebaseio.com",
    projectId: "bettercord-52166",
    storageBucket: "bettercord-52166.firebasestorage.app",
    messagingSenderId: "31822010107",
    appId: "1:31822010107:web:fb7a95036abe214e0d425e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const statusRef = ref(db, "lockdownState");
  const reportsRef = ref(db, "reports");

  onValue(statusRef, (snapshot) => {
    const isLocked = snapshot.val();
    let overlay = document.getElementById("lockdown-overlay");

    if (isLocked) {
      if (!overlay) {
        // Inject Tailwind CSS for modern animations & styling
        if (!document.getElementById("tailwind-cdn")) {
          const tw = document.createElement("script");
          tw.id = "tailwind-cdn";
          tw.src = "https://cdn.tailwindcss.com";
          document.head.appendChild(tw);
        }

        overlay = document.createElement("div");
        overlay.id = "lockdown-overlay";
        overlay.className = "fixed inset-0 z-[999999] flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4 transition-all duration-500 animate-fadeIn";
        
        overlay.innerHTML = `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl max-w-lg w-full p-8 text-center transform transition-all duration-500 scale-100 animate-scaleUp text-slate-100">
            <div class="w-20 h-20 bg-rose-500/10 border border-rose-500/20 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg shadow-rose-500/10">
              <svg class="w-10 h-10 animate-pulse" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
              </svg>
            </div>
            
            <h1 class="text-3xl font-extrabold tracking-tight text-white mb-2">Access Restricted</h1>
            <p class="text-slate-400 text-sm mb-6">This website has been temporarily locked by the administrator. Please wait with patience while maintenance or security protocols are active.</p>
            
            <div class="bg-slate-800/50 border border-slate-700/50 rounded-xl p-4 mb-6 text-left">
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Send Report / Message to Admin</label>
              <div class="flex gap-2">
                <input type="text" id="user-report-input" placeholder="Describe issue or request access..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors">
                <button id="send-report-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2 rounded-lg text-sm transition-all shadow-md shadow-indigo-600/20">Send</button>
              </div>
              <p id="report-status" class="text-xs text-emerald-400 mt-2 hidden">Report sent successfully to admin dashboard!</p>
            </div>

            <div class="text-xs text-slate-500 flex items-center justify-center gap-2">
              <span class="w-2 h-2 rounded-full bg-rose-500 animate-ping"></span>
              Secure Lockdown Active
            </div>
          </div>
        `;
        document.body.appendChild(overlay);

        // Handle report submission
        document.getElementById("send-report-btn").addEventListener("click", async () => {
          const input = document.getElementById("user-report-input");
          const statusMsg = document.getElementById("report-status");
          if (input.value.trim() !== "") {
            await push(reportsRef, {
              message: input.value.trim(),
              timestamp: serverTimestamp(),
              url: window.location.href
            });
            input.value = "";
            statusMsg.classList.remove("hidden");
            setTimeout(() => statusMsg.classList.add("hidden"), 4000);
          }
        });
      }
    } else {
      if (overlay) {
        overlay.classList.add("opacity-0");
        setTimeout(() => overlay.remove(), 300);
      }
    }
  });
</script>
